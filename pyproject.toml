[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "spriggler"
version = "0.5.0-dev"
description = "Physics-informed environmental controller for grow environments, aquaculture, brewing, and more"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "William Maness"},
]
dependencies = [
    "click>=8.1",
    "rich>=13.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
ble = ["bleak>=0.21", "govee-ble>=0.31", "habluetooth>=3.0"]
kasa = ["python-kasa>=0.6"]
vesync = ["pyvesync>=2.1"]
all = ["spriggler[ble,kasa,vesync]"]
dev = ["pytest>=7.0", "pytest-asyncio>=0.21"]

[project.scripts]
spriggler = "spriggler.cli.main:cli"

[tool.setuptools.packages.find]
where = ["src"]
